<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>StreamerIsolate</title>
    <style>
      :root {
        color-scheme: light dark;
        --fg: #1a1a1a;
        --muted: #666;
        --bg: #fff;
        --border: #d8d8d8;
        --accent: #2e7d32;
        --error: #c62828;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --fg: #ececec;
          --muted: #9e9e9e;
          --bg: #1e1e1e;
          --border: #3a3a3a;
          --accent: #66bb6a;
          --error: #ef5350;
        }
      }
      body {
        width: 280px;
        margin: 0;
        padding: 14px;
        font: 13px/1.4 system-ui, -apple-system, sans-serif;
        color: var(--fg);
        background: var(--bg);
      }
      h1 { font-size: 14px; margin: 0 0 2px; }
      .status { color: var(--muted); font-size: 12px; margin-bottom: 12px; }
      .status.on { color: var(--accent); font-weight: 600; }
      .status.err { color: var(--error); }
      .status .detail {
        display: block;
        margin-top: 4px;
        font-size: 10px;
        opacity: 0.75;
      }
      .status code {
        display: inline-block;
        margin-top: 3px;
        padding: 1px 5px;
        background: rgba(128, 128, 128, 0.18);
        border-radius: 3px;
        font-size: 11px;
      }
      label { display: block; margin-bottom: 4px; color: var(--muted); font-size: 12px; }
      select, button {
        width: 100%;
        padding: 7px;
        font: inherit;
        color: var(--fg);
        background: transparent;
        border: 1px solid var(--border);
        border-radius: 6px;
      }
      select { margin-bottom: 10px; }
      button { font-weight: 600; cursor: pointer; }
      button:hover { border-color: var(--accent); }
      button:disabled { opacity: 0.5; cursor: default; }
      .field { margin-top: 14px; }
      .field-label { display: flex; justify-content: space-between; margin-bottom: 6px; }
      .field-label span:last-child { color: var(--muted); font-variant-numeric: tabular-nums; }
      input[type="range"] { width: 100%; accent-color: var(--accent); }
      .hint { margin-top: 8px; font-size: 11px; color: var(--muted); }
      .version {
        margin-top: 10px;
        font-size: 10px;
        color: var(--muted);
        text-align: right;
      }
    </style>
  </head>
  <body>
    <h1>StreamerIsolate</h1>
    <div class="status" id="status">Connecting…</div>

    <label for="input">Capture the stream's audio from</label>
    <select id="input"></select>

    <label for="output">Play the cleaned audio to</label>
    <select id="output"></select>

    <button id="toggle" disabled>Start</button>

    <div class="field">
      <div class="field-label">
        <span>Vocal attenuation</span>
        <span id="strengthValue">100%</span>
      </div>
      <input type="range" id="strength" min="0" max="100" step="1" value="100" />
    </div>

    <div class="hint" id="hint">
      Firefox can't hand a tab's audio to an extension, so the StreamerIsolate backend
      does the audio through a virtual audio device. Start it first, then use
      this popup.
    </div>

    <div class="version" id="si-version"></div>

    <script src="popup.js"></script>
  </body>
</html>
