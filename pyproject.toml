[project]
name = "streamerisolate"
version = "0.1.0"
description = "Near-real-time music removal from livestream audio, using Demucs source separation."
requires-python = ">=3.10"
dependencies = [
    "torch",
    "demucs",
    "sounddevice",
    "numpy",
    "scipy",
    "websockets",
    "panns-inference",
    "PySide6-Essentials",
]

[project.scripts]
streamerisolate = "streamerisolate.cli:main"

[project.gui-scripts]
streamerisolate-gui = "streamerisolate.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
